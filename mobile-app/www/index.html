<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LegalEase Connect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0A2843;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #10B981, #0CA275);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    p.sub { font-size: 14px; color: #94A3B8; margin-bottom: 28px; max-width: 320px; line-height: 1.5; }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      backdrop-filter: blur(12px);
    }
    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #10B981;
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: #10B981;
      color: #0A2843;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn:active { background: #059669; }
    .presets {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .preset-btn {
      flex: 1;
      padding: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #94A3B8;
      font-size: 11px;
      cursor: pointer;
    }
    .preset-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.15); }
    .status {
      font-size: 12px;
      margin-top: 16px;
      color: #64748B;
    }
  </style>
</head>
<body>

  <div class="logo">LE</div>
  <h1>LegalEase Mobile</h1>
  <p class="sub">Connect this app dynamically to your server or local network.</p>

  <div class="card">
    <div class="input-group">
      <label for="serverUrl">Server / Domain URL</label>
      <input type="url" id="serverUrl" placeholder="https://legalease.pk or http://192.168.1.36:3000" />
    </div>

    <button class="btn" id="connectBtn" onclick="connectToServer()">Connect Now</button>

    <div class="presets">
      <button class="preset-btn" onclick="setPreset('https://legalease.pk')">Production</button>
      <button class="preset-btn" onclick="setPreset('http://192.168.1.36:3000')">Local Wi-Fi</button>
    </div>

    <p class="status" id="statusText">Stored destination: none</p>
  </div>

  <script>
    const savedUrl = localStorage.getItem('legalease_dynamic_server_url');
    const input = document.getElementById('serverUrl');
    const statusText = document.getElementById('statusText');

    if (savedUrl) {
      input.value = savedUrl;
      statusText.innerText = 'Connecting to: ' + savedUrl + '...';
      // Auto-redirect if already saved
      setTimeout(() => {
        window.location.href = savedUrl;
      }, 600);
    } else {
      input.value = 'http://192.168.1.36:3000';
    }

    function setPreset(url) {
      input.value = url;
    }

    function connectToServer() {
      let url = input.value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      localStorage.setItem('legalease_dynamic_server_url', url);
      statusText.innerText = 'Connecting to ' + url + '...';
      window.location.href = url;
    }
  </script>

</body>
</html>
